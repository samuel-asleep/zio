name: Overwrite fix branch from copilot branch

on:
  workflow_dispatch:

jobs:
  overwrite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix-zstream-mapziopar-issue
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "samuel-asleep"
          git config user.email "benneu40@gmail.com"

      - name: Fetch copilot branch
        run: |
          git fetch origin copilot/fix-zstream-mapziopar-issue

      - name: Overwrite files from copilot branch
        run: |
          # Replace working tree with copilot branch contents
          git checkout origin/copilot/fix-zstream-mapziopar-issue -- .

      - name: Commit changes
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fix ci"
          else
            echo "No changes to commit"
          fi

      - name: Push changes
        run: |
          git push origin fix-zstream-mapziopar-issue
